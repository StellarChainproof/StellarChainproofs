name: "ChainProof Smart Contract Audit"
description: "Scan Solidity smart contracts for vulnerabilities and gas issues. Fails CI on critical/high findings."
author: "ChainProof"

branding:
  icon: "shield"
  color: "blue"

inputs:
  targets:
    description: "Space-separated paths to .sol files or directories to scan"
    required: false
    default: "contracts/"

  min-severity:
    description: "Minimum severity to fail CI on: critical|high|medium|low"
    required: false
    default: "high"

  use-slither:
    description: "Run Slither if available (true/false)"
    required: false
    default: "true"

  api-key:
    description: "Anthropic API key for LLM-enhanced explanations"
    required: false
    default: ""

  report-format:
    description: "Report format for PR comments: markdown|json"
    required: false
    default: "markdown"

  upload-report:
    description: "Upload audit report as a GitHub Actions artifact (true/false)"
    required: false
    default: "true"

  fail-on-gas:
    description: "Fail CI if gas optimization hints exceed threshold"
    required: false
    default: "false"

  diff-ref:
    description: "Git reference or base branch to diff against (e.g. origin/main or HEAD~1). Enables diff-aware mode when set."
    required: false
    default: ""

  validate:
    description: "Generate a ValidationPlan from scan findings and upload it as an artifact (true/false)"
    required: false
    default: "false"

  validate-adapter:
    description: "EVM adapter to use when running validation scenarios: anvil|hardhat"
    required: false
    default: "anvil"

  validate-run:
    description: "Execute the generated ValidationPlan against the EVM adapter (true/false). Requires the adapter to be installed on the runner."
    required: false
    default: "false"

outputs:
  critical-count:
    description: "Number of critical severity findings"
  high-count:
    description: "Number of high severity findings"
  total-count:
    description: "Total number of findings"
  introduced-count:
    description: "Number of newly introduced findings in diff mode"
  resolved-count:
    description: "Number of resolved findings in diff mode"
  report-path:
    description: "Path to the generated audit report"
  validate-plan-path:
    description: "Path to the generated ValidationPlan JSON (when validate: true)"
  validate-report-path:
    description: "Path to the ValidationReport JSON (when validate-run: true)"

runs:
  using: "node20"
  main: "dist/action.js"
